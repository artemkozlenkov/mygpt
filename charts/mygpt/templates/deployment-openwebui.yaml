apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mygpt.fullname" . }}-openwebui
  namespace: {{ .Values.namespace }}
  labels: {{- include "mygpt.labels" . | nindent 4 }}
    app.kubernetes.io/component: openwebui
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "mygpt.selectorLabels" (dict "root" . "component" "openwebui") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mygpt.selectorLabels" (dict "root" . "component" "openwebui") | nindent 8 }}
    spec:
      containers:
        - name: openwebui
          image: {{ .Values.images.openwebui }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: {{ include "mygpt.secretName" . }}
          env:
            # compose overrides DATABASE_URL with OpenWebUI's own DB; mirror it.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "mygpt.secretName" . }}
                  key: OPENWEBUI_DATABASE_URL
            # AUDIO_TTS_OPENAI_API_KEY comes from the shared secret (envFrom)
            # and holds the Azure OpenAI key for TTS.
          volumeMounts:
            - name: openwebui-data
              mountPath: /app/backend/data
          # Slow startup (Whisper STT model loads on boot) — only route traffic
          # to this pod once /health actually responds.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.openwebui | nindent 12 }}
      volumes:
        - name: openwebui-data
          persistentVolumeClaim:
            claimName: {{ include "mygpt.fullname" . }}-openwebui
