litellm_settings:
    drop_params: true

model_list:
  # Grok via the xAI provider directly.
  # api_key/api_base are read from XAI_API_KEY / XAI_API_BASE env vars
  # (xai provider native).
  - model_name: grok-4.5
    litellm_params:
      model: xai/grok-4.5

  # Azure AI Foundry chat deployment "gpt-5.6-luna"
  - model_name: gpt-5.6-luna
    litellm_params:
      model: azure_ai/gpt-5.6-luna
    model_info:
      mode: chat
      health_check_supports_max_tokens: false

  # Azure AI Foundry embedding deployment "text-embedding-3-large" (RAG)
  - model_name: text-embedding-3-large
    litellm_params:
      model: azure_ai/text-embedding-3-large
    model_info:
      mode: embedding
