services:
  caddy:
    container_name: caddy
    # Custom image with the caddy-dns/azure module (DNS-01 for chat.softawebit.com)
    build: ./caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on:
      - openwebui
    networks:
      - my_network

  litellm:
    container_name: litellm
    image: ghcr.io/berriai/litellm:v1.94.0
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    env_file: .env
    command: ["--config", "/app/config.yaml", "--detailed_debug"]
    networks:
      - my_network

  openwebui:
    container_name: webui
    image: ghcr.io/open-webui/open-webui:0.11.0
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - db
    env_file: .env
    environment:
      DATABASE_URL: ${OPENWEBUI_DATABASE_URL}
    restart: unless-stopped
    networks:
      - my_network

  db:
    container_name: db
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    volumes:
      - ./pgdata:/var/lib/postgresql:rw
      - ./initdb.d:/docker-entrypoint-initdb.d
    networks:
      - my_network

  redis:
    container_name: redis
    image: redis:8.8.1
    restart: unless-stopped
    networks:
      - my_network

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:2026.7.28-c01178d03
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      UWSGI_WORKERS: ${SEARXNG_UWSGI_WORKERS:-4}
      UWSGI_THREADS: ${SEARXNG_UWSGI_THREADS:-4}
    cap_drop: ['ALL']
    cap_add: ['CHOWN', 'SETGID', 'SETUID']
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - my_network

volumes:
  litellm:
  open-webui:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  my_network:
    driver: bridge
