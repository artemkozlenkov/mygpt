services:
  caddy:
    container_name: caddy
    # Only started explicitly for the public/domain deployment
    # (`docker compose --profile deploy up -d`) — the local stack runs on
    # localhost without Caddy.
    profiles: ["deploy"]
    # Custom image with the caddy-dns/azure module (DNS-01 for chat.softawebit.com)
    build: ./caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file: .env
    depends_on:
      - openwebui
    networks:
      - my_network

  litellm:
    container_name: litellm
    image: ghcr.io/berriai/litellm:v1.94.0
    restart: unless-stopped
    depends_on:
      - db
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    env_file: .env
    command: ["--config", "/app/config.yaml", "--detailed_debug"]
    ports:
      - "4000:4000"
    networks:
      - my_network

  openwebui:
    container_name: webui
    image: ghcr.io/open-webui/open-webui:0.11.0
    volumes:
      - open-webui:/app/backend/data
    ports:
      - "8000:8080"
    depends_on:
      - db
      - kokoro-web
    env_file: .env
    environment:
      DATABASE_URL: ${OPENWEBUI_DATABASE_URL}
      # TTS API key for the Kokoro Web sidecar (must match KW_SECRET_API_KEY)
      AUDIO_TTS_OPENAI_API_KEY: ${KW_SECRET_API_KEY}
    restart: unless-stopped
    networks:
      - my_network

  kokoro-web:
    container_name: kokoro-web
    # Local neural TTS (Kokoro-82M). Serves an OpenAI-compatible /audio/speech
    # API that OpenWebUI uses for Text-to-Speech. No API keys or cloud needed.
    image: ghcr.io/eduardolat/kokoro-web:0.1.3
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      KW_SECRET_API_KEY: ${KW_SECRET_API_KEY}
    volumes:
      - kokoro-cache:/kokoro/cache
    networks:
      - my_network

  db:
    container_name: db
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    volumes:
      - ./pgdata:/var/lib/postgresql:rw
      - ./initdb.d:/docker-entrypoint-initdb.d
    networks:
      - my_network

  redis:
    container_name: redis
    image: redis:8.8.1
    restart: unless-stopped
    networks:
      - my_network

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:2026.7.28-c01178d03
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost/
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      UWSGI_WORKERS: ${SEARXNG_UWSGI_WORKERS:-4}
      UWSGI_THREADS: ${SEARXNG_UWSGI_THREADS:-4}
    cap_drop: ['ALL']
    cap_add: ['CHOWN', 'SETGID', 'SETUID']
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
    networks:
      - my_network

volumes:
  litellm:
  open-webui:
  pgdata:
  caddy_data:
  caddy_config:
  kokoro-cache:

networks:
  my_network:
    driver: bridge
