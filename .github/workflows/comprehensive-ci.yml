name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  security:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  helm:
    name: Helm chart lint + render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Lint chart
        run: helm lint charts/mygpt
      - name: Render manifests
        run: |
          helm template mygpt charts/mygpt --namespace mygpt > /tmp/render.yaml
          test "$(grep -c '^kind:' /tmp/render.yaml)" -ge 17 \
            || { echo "chart rendered <17 resources"; exit 1; }
          grep -q 'kind: Deployment' /tmp/render.yaml \
            || { echo "no Deployments rendered"; exit 1; }

  secrets-encryption:
    name: Chart secrets are SOPS-encrypted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert values.secrets.yaml is SOPS ciphertext
        run: |
          grep -q '^sops:' charts/mygpt/values.secrets.yaml \
            || { echo "values.secrets.yaml is NOT SOPS-encrypted"; exit 1; }
          grep -qE 'ENC\[AES256_GCM' charts/mygpt/values.secrets.yaml \
            || { echo "no SOPS ciphertext found"; exit 1; }
          ! grep -qE 'sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|dbpassword9090' \
            charts/mygpt/values.secrets.yaml \
            || { echo "possible plaintext secret leaked into values.secrets.yaml"; exit 1; }

  structure:
    name: File structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files exist
        run: |
          for f in charts/mygpt/Chart.yaml charts/mygpt/values.yaml \
                   charts/mygpt/values.secrets.yaml .sops.yaml README.md \
                   docs/k8s-migration.md LICENSE.md .gitleaks.toml; do
            test -f "$f" || { echo "ERROR: missing $f"; exit 1; }
          done
          echo "All required files found!"
