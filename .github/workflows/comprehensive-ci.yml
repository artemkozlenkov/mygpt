name: Comprehensive CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare .env from example
        run: cp .env.example .env

      - name: Validate Docker Compose
        run: docker compose -f compose.yml config --quiet

      - name: Check Docker Compose syntax
        run: docker compose -f compose.yml config --quiet

  file-structure:
    name: File Structure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          test -f Makefile || echo "ERROR: Makefile not found"
          test -f compose.yml || echo "ERROR: compose.yml not found"
          test -f litellm_config.yaml || echo "ERROR: litellm_config.yaml not found"
          test -f .env.example || echo "ERROR: .env.example not found"
          test -f .gitleaks.toml || echo "ERROR: .gitleaks.toml not found"
          test -f LICENSE.md || echo "ERROR: LICENSE.md not found"
          test -f README.md || echo "ERROR: README.md not found"
          echo "All required files found!"

      - name: Check directory structure
        run: |
          echo "Checking directory structure..."
          test -d initdb.d || echo "ERROR: initdb.d directory not found"
          test -d searxng || echo "ERROR: searxng directory not found"
          echo "All required directories found!"

  environment:
    name: Environment Files Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check environment files exist
        run: |
          echo "Checking environment files..."
          test -f .env.example || echo "ERROR: .env.example not found"
          echo "Environment example file found!"

      - name: Validate environment file syntax
        run: |
          echo "Validating .env.example..."
          grep -q "DATABASE_URL" .env.example || echo "ERROR: DATABASE_URL not found in .env.example"
          grep -q "LITELLM_MASTER_KEY" .env.example || echo "ERROR: LITELLM_MASTER_KEY not found in .env.example"
          grep -q "REDIS_URL" .env.example || echo "ERROR: REDIS_URL not found in .env.example"
          grep -q "OPENAI_API_BASE_URL" .env.example || echo "ERROR: OPENAI_API_BASE_URL not found in .env.example"
          grep -q "OPENAI_API_KEYS" .env.example || echo "ERROR: OPENAI_API_KEYS not found in .env.example"
          echo "Environment file validated!"

  documentation:
    name: Documentation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check README exists
        run: |
          test -f README.md || echo "ERROR: README.md not found"
          grep -q "Hybrid GPT Chat Application" README.md || echo "ERROR: README.md missing main title"
          grep -q "Quick Start on a New Machine" README.md || echo "ERROR: README.md missing Quick Start section"
          grep -q "Configuration" README.md || echo "ERROR: README.md missing Configuration section"
          grep -q "Usage" README.md || echo "ERROR: README.md missing Usage section"
          echo "README.md validated!"

      - name: Check LICENSE exists
        run: |
          test -f LICENSE.md || echo "ERROR: LICENSE.md not found"
          echo "LICENSE.md found!"

      - name: Check .gitignore exists
        run: |
          test -f .gitignore || echo "ERROR: .gitignore not found"
          echo ".gitignore found!"

  all-checks:
    name: All Checks Summary
    runs-on: ubuntu-latest
    needs: [security, docker, file-structure, environment, documentation]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "All CI checks completed!"
          echo "Security: ${{ needs.security.result }}"
          echo "Docker: ${{ needs.docker.result }}"
          echo "File Structure: ${{ needs.file-structure.result }}"
          echo "Environment: ${{ needs.environment.result }}"
          echo "Documentation: ${{ needs.documentation.result }}"
