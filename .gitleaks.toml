# Gitleaks configuration for mygpt.
# Extends the default rule set (https://github.com/gitleaks/gitleaks/blob/master/config/gitleaks.toml).
title = "Gitleaks config for mygpt"

[extend]
useDefault = true

# Allowlist
#
# searxng/settings.yml historically contained the local SearxNG session-signing
# key (server.secret_key). It is NOT a cloud credential — it only signs local
# SearxNG session cookies for the self-hosted instance. The key now lives in the
# git-ignored .env file (SEARXNG_SECRET); the tracked file holds a placeholder.
[allowlist]
paths = [
  '''searxng/settings.yml''',
]
